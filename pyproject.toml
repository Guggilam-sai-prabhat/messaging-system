[project]
name = "messaging-system"
version = "0.2.0"
description = "Production-scale messaging system — connection layer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "websockets",
    "confluent-kafka>=2.6.0",
    "pydantic-settings>=2.0.0",
    "redis>=5.0.0",
    "asyncpg>=0.31.0",
    "sqlalchemy>=2.0.48",
    "alembic>=1.18.4",
    "psycopg2>=2.9.11",
    "pyjwt>=2.12.1",
    "bcrypt>=5.0.0",
    "pydantic[email]>=2.12.5",
    "minio>=7.2.20",
    "apscheduler>=3.11.2",
    "pypdf>=4.0.0",
    "pgvector>=0.3.0",
    "sentence-transformers>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
pythonpath = ["."]
